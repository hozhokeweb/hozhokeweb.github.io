<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}{% if page.title and page.title != site.title %} &middot; {{ site.title }}{% endif %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
{% if page.mathjax %}
<!-- MathJax (CDN). Fine for a served page; the only external dependency. -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>
{% endif %}
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --muted: #57574f;
    --faint: #d4d3cc;
    --bg: #f7f6f1;
    --accent: #3f6f52;   /* the green of W_f in Figure 2 */
  }

  html { -webkit-font-smoothing: antialiased; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    line-height: 1.7;
    font-size: clamp(1.05rem, 1.9vw, 1.2rem);
    padding: 0 clamp(1.4rem, 5vw, 3rem);
  }

  .wrap { max-width: 680px; margin: 0 auto; }

  header { padding: clamp(3rem, 9vh, 6rem) 0 2.5rem; }

  .wordmark {
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    display: inline-block;
    margin-bottom: clamp(2rem, 6vh, 3.5rem);
  }
  .wordmark:hover { color: var(--ink); }

  h1 {
    font-weight: 600;
    font-size: clamp(1.7rem, 4.5vw, 2.4rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 1rem;
  }

  .byline {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .byline a { color: var(--muted); }

  .lede {
    font-size: clamp(1.15rem, 2.2vw, 1.35rem);
    line-height: 1.6;
    color: var(--muted);
    margin: 1.8rem 0 0;
    font-style: italic;
  }

  h2 {
    font-weight: 600;
    font-size: clamp(1.25rem, 3vw, 1.55rem);
    letter-spacing: -0.005em;
    margin: 2.8rem 0 0.9rem;
  }

  p { margin: 0 0 1.15rem; }

  a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  a:hover { color: var(--ink); }

  em { font-style: italic; }
  strong { font-weight: 600; }

  code, .mono {
    font-family: 'DM Mono', monospace;
    font-size: 0.86em;
    background: rgba(0,0,0,0.035);
    padding: 0.05em 0.35em;
    border-radius: 2px;
  }

  figure { margin: 2rem 0; }
  figure img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 3px;
  }
  figcaption {
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--muted);
    margin-top: 0.8rem;
    padding: 0 0.2rem;
  }
  figcaption .lab { font-weight: 600; color: var(--ink); }

  .rule { width: 2.5rem; height: 1px; background: var(--faint); margin: 3rem 0; }

  blockquote {
    border-left: 2px solid var(--faint);
    padding-left: 1.1rem;
    margin: 1.4rem 0;
    color: var(--muted);
  }

  .callout {
    background: rgba(63,111,82,0.06);
    border: 1px solid rgba(63,111,82,0.18);
    border-radius: 4px;
    padding: 1.1rem 1.3rem;
    margin: 1.8rem 0;
    font-size: 0.98em;
  }
  .callout p:last-child { margin-bottom: 0; }

  .paper-link {
    display: block;
    border: 1px solid var(--faint);
    border-radius: 4px;
    padding: 1.1rem 1.3rem;
    margin: 2rem 0;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.2s, background 0.2s;
  }
  .paper-link:hover { border-color: #a0a099; background: rgba(0,0,0,0.02); color: var(--ink); }
  .paper-link .k {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 0.35rem;
  }
  .paper-link .t { font-weight: 600; font-size: 1.05rem; }
  .paper-link .m { font-size: 0.9rem; color: var(--muted); margin-top: 0.2rem; }

  footer {
    border-top: 1px solid var(--faint);
    margin-top: 3.5rem;
    padding: 1.6rem 0 3rem;
  }
  .footer-mark {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: var(--faint);
  }

  /* Post listing (/blog/) */
  .post-list { list-style: none; margin: 1rem 0 0; padding: 0; }
  .post-list li { padding: 1.6rem 0; border-top: 1px solid var(--faint); }
  .post-list li:first-child { border-top: none; padding-top: 0.4rem; }
  .post-list .post-title {
    font-weight: 600;
    font-size: clamp(1.2rem, 2.6vw, 1.45rem);
    line-height: 1.25;
    text-decoration: none;
    color: var(--ink);
  }
  .post-list .post-title:hover { color: var(--accent); }
  .post-list .post-meta {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0.45rem 0 0.6rem;
  }
  .post-list .post-excerpt { color: var(--muted); margin: 0; }

  mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
  mjx-container[display="true"] { margin: 1.4rem 0 !important; }
</style>
</head>
<body>
{{ content }}
</body>
</html>
